name = "wg-putzplan-mailcode"
main = "src/index.js"
compatibility_date = "2024-05-18"

# Same D1 database as the Putzplan app
[[d1_databases]]
binding = "DB"
database_name = "putzplan-db"
database_id = "921b1908-de45-4ac2-9ae5-6d263649aedf"

[vars]
# Comma-separated: full addresses or domains whose mails are accepted.
# If you forward from your own mailbox, add your own address here too.
ALLOWED_SENDERS = "accountprotection.microsoft.com"
# Optional: also deliver the original mail to a verified address
# FORWARD_TO = "you@example.com"
